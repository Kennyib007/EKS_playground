apiVersion: v1
kind: Secret
metadata:
  name: argocd-repo-creds
  namespace: argocd
type: Opaque
stringData:
  url: https://github.com/kehindeibrahim/Cloud.git
  username: placeholder
  password: placeholder
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kehindeibrahim/Cloud.git
    targetRevision: HEAD
    path: EKS Platform/gitops/clusters/development
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
